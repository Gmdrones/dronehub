<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Página não encontrada | DroneHub</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0d12;color:#f0f4f8;padding:24px}
    main{max-width:640px;width:100%;padding:clamp(28px,6vw,56px);border:1px solid #243243;border-radius:22px;background:#12161d;text-align:center}
    .brand{font-weight:800;letter-spacing:.02em;font-size:24px}.brand span{color:#00d2ff}
    .code{font-size:clamp(75px,15vw,140px);color:#00d2ff;letter-spacing:-.075em;font-weight:800;line-height:1.2;margin:28px 0 2px}
    h1{font-size:clamp(24px,5vw,34px);margin:0 0 14px}
    p{color:#a6b5c8;line-height:1.65;margin:0 auto 30px;max-width:430px}
    nav{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
    a{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:9px;border:1px solid #344252;color:#f0f4f8;font-weight:600}
    a:first-child{background:#00d2ff;color:#0a0d12;border-color:#00d2ff}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="brand">Drone<span>Hub</span></div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Página não encontrada</h1>
    <p>Este endereço não existe ou foi alterado. Você pode voltar à página inicial ou acessar sua conta.</p>
    <nav aria-label="Navegação de retorno">
      <a href="/">Voltar ao início</a>
      <a href="/login">Entrar no DroneHub</a>
    </nav>
  </main>
</body>
</html>
