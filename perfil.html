<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Drone Hub</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/supabase.js?v=20260726-sarpas"></script>
  <link rel="stylesheet" href="css/plan-access.css">
  <script src="js/plan-access.js?v=20260726-free-lock"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0A0D12; --bg2:#12161D; --bg3:#1A1F2A; --border:rgba(255,255,255,0.05); --cyan:#00D2FF; --cyan-glow:rgba(0,210,255,0.15); --cyan-subtle:rgba(0,210,255,0.05); --green:#34D399; --green-bg:rgba(52,211,153,0.1); --amber:#FFB020; --red:#F04438; --red-bg:rgba(240,68,56,0.1); --text:#F0F4F8; --text2:#94A3B8; --text3:#64748B; --title:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; }
    body { font-family:var(--body); background:var(--bg); color:var(--text); min-height:100vh; }
    a { text-decoration:none; color:inherit; }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--cyan),#0066FF); display:flex; align-items:center; justify-content:center; font-family:var(--title); font-weight:700; font-size:1rem; color:#0A0D12; flex-shrink:0; }
    .logo-text { font-family:var(--title); font-weight:700; font-size:1.15rem; color:var(--text); letter-spacing:-0.02em; }
    .logo-text span { color:var(--cyan); }
    .header { position:fixed; top:0; left:0; right:0; z-index:1000; height:64px; background:rgba(10,13,18,0.9); backdrop-filter:blur(24px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; }
    .header-inner { width:100%; max-width:1600px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
    .header-left { display:flex; align-items:center; gap:32px; }
    .header-right { display:flex; align-items:center; gap:16px; }
    .header-profile { display:flex; align-items:center; gap:10px; padding:4px 12px 4px 4px; border-radius:8px; background:var(--bg2); border:1px solid var(--border); cursor:pointer; }
    .header-profile .av { width:28px; height:28px; border-radius:6px; background:linear-gradient(135deg,var(--cyan),#0066FF); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.7rem; color:#0A0D12; }
    .header-profile .info { font-size:0.75rem; }
    .header-profile .info .name { font-weight:600; color:var(--text); }
    .header-profile .info .plan { font-size:0.6rem; color:var(--text3); text-transform:uppercase; }
    .dash-wrap { display:flex; padding-top:64px; min-height:100vh; }
    .sidebar { width:240px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; position:fixed; top:64px; left:0; bottom:0; z-index:100; overflow-y:auto; }
    .sidebar-top { padding:24px 20px 20px; border-bottom:1px solid var(--border); }
    .sidebar-nav { padding:12px; flex:1; display:flex; flex-direction:column; gap:2px; }
    .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; color:var(--text2); font-size:0.85rem; text-decoration:none; transition:all 0.2s; }
    .sidebar-nav a:hover { background:var(--cyan-subtle); color:var(--text); }
    .sidebar-nav a.active { background:var(--cyan-subtle); color:var(--cyan); font-weight:600; box-shadow:inset 0 0 0 1px rgba(0,210,255,0.1); }
    .sidebar-nav a .ico { width:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sidebar-nav a .ico svg { width:18px; height:18px; }
    .sidebar-foot { padding:16px 20px; border-top:1px solid var(--border); }
    .sidebar-foot-label { font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text3); }
    .sidebar-foot-name { font-size:0.9rem; font-weight:700; margin-top:2px; }
    .sidebar-foot-name.free { color:var(--cyan); }
    .sidebar-foot-name.pro { color:var(--amber); }
    .sidebar-foot a { font-size:0.7rem; color:var(--cyan); margin-top:6px; display:inline-block; }
    .main { margin-left:240px; flex:1; padding:32px; }
    .page-title { font-family:var(--title); font-size:1.5rem; font-weight:700; margin-bottom:4px; }
    .page-sub { color:var(--text3); font-size:0.85rem; margin-bottom:28px; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:28px; margin-bottom:24px; }
    .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .card-header h3 { font-family:var(--title); font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:8px; }
    .card-header h3 svg { width:16px; height:16px; color:var(--cyan); }
    .card label { font-size:0.75rem; color:var(--text3); display:block; margin-bottom:6px; font-weight:500; text-transform:uppercase; letter-spacing:0.04em; }
    .card input, .card select { width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:var(--body); font-size:0.9rem; transition:all 0.2s; }
    .card input:focus, .card select:focus { outline:none; border-color:rgba(0,210,255,0.3); box-shadow:0 0 0 3px rgba(0,210,255,0.05); }
    .btn { display:inline-flex; align-items:center; gap:8px; font-family:var(--title); font-weight:600; font-size:0.85rem; padding:10px 24px; border-radius:8px; border:none; cursor:pointer; transition:all 0.3s ease; text-decoration:none; }
    .btn-primary { background:var(--cyan); color:#0A0D12; }
    .btn-primary:hover { background:#33DDFF; box-shadow:0 0 30px var(--cyan-glow); transform:translateY(-1px); }
    .btn-secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
    .btn-secondary:hover { border-color:var(--cyan); color:var(--cyan); }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .photo-area { text-align:center; margin-bottom:28px; }
    .photo-preview { width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),#0066FF); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:3rem; font-weight:700; color:#fff; overflow:hidden; cursor:pointer; border:3px solid var(--border); transition:all 0.3s; }
    .photo-preview:hover { border-color:var(--cyan); }
    .photo-preview img { width:100%; height:100%; object-fit:cover; }
    .photo-area input[type="file"] { display:none; }
    .photo-label { font-size:0.8rem; color:var(--cyan); cursor:pointer; font-weight:600; }
    .row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
    .row:last-child { border-bottom:none; }
    .row-info { flex:1; }
    .row-info strong { color:var(--text); }
    .row-info span { color:var(--text3); font-size:0.8rem; }
    .row-actions { display:flex; gap:8px; flex-shrink:0; }
    .action-btn { padding:6px 14px; border-radius:6px; font-size:0.75rem; font-weight:600; border:none; cursor:pointer; transition:all 0.2s; }
    .action-btn.edit { background:var(--cyan-subtle); color:var(--cyan); border:1px solid rgba(0,210,255,0.15); }
    .action-btn.edit:hover { background:rgba(0,210,255,0.15); }
    .action-btn.delete { background:var(--red-bg); color:var(--red); border:1px solid rgba(240,68,56,0.15); }
    .action-btn.delete:hover { background:rgba(240,68,56,0.15); }
    .add-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:20px; }
    .add-bar input, .add-bar select { padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:var(--body); font-size:0.85rem; }
    @media (max-width:768px) { .sidebar { display:none; } .main { margin-left:0; padding:16px; } .grid-2,.grid-3 { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="css/saas.css">
  <link rel="stylesheet" href="css/module-premium.css?v=20260724">
  <script src="js/module-premium.js?v=20260724" defer></script>
  <link rel="stylesheet" href="css/mobile-nav.css?v=20260724">
  <script src="js/mobile-nav.js?v=20260724" defer></script>
</head>
<body>
  <script>
    var user = JSON.parse(localStorage.getItem('dronehub_user') || 'null');
    if (!user) { window.location.href = 'login.html'; }
    var isPro = user.plan === 'pro';
    var uid = user.id || user.email || 'default';
    var saved = getProfile(uid);
  </script>

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-profile" onclick="location.href='dashboard.html'" style="cursor:pointer;">
          <div class="av" id="avatarInitial">U</div>
          <div class="info"><div class="name" id="userNameHeader">Usuario</div><div class="plan" id="planBadge">FREE</div></div>
        </div>
      </div>
      <div class="header-right">
        <a href="dashboard.html" class="btn btn-primary" style="padding:8px 20px;font-size:0.8rem;">Dashboard</a>
      </div>
    </div>
  </header>

  <div class="dash-wrap">
    <aside class="sidebar">
      <div class="sidebar-top"><div class="logo"><div class="logo-icon">DH</div><span class="logo-text">Drone<span>Hub</span></span></div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="12" rx="1"/><rect width="7" height="7" x="3" y="16" rx="1"/></svg></span> Dashboard</a>
        <a href="perfil.html" class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span> Perfil</a>
        <a href="aeronaves.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg></span> Aeronaves</a>
        <a href="central-voo.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></span> Central de Voo</a>
        <a href="documentos.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span> Documentos</a>
        <a href="missoes.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m12 6 3.6 4.8-1.6 6-2-3.8-2 3.8-1.6-6L12 6z"/></svg></span> Missoes</a>
        <a href="fiscalizacao.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span> Fiscalizacao</a>
        <a href="financeiro.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span> Financeiro</a>
      </nav>
      <div class="sidebar-foot"><div class="sidebar-foot-label">Plano atual</div><div class="sidebar-foot-name" id="planName">Free</div><a href="precos.html" id="planLink">Fazer upgrade</a></div>
    </aside>

    <main class="main">
      <h1 class="page-title">Perfil do Piloto</h1>
      <p class="page-sub">Gerencie seus dados pessoais, certificacoes e documentos</p>

      <div class="card">
        <div class="photo-area">
          <div class="photo-preview" id="photoPreview" onclick="document.getElementById('photoInput').click()"><span id="photoInitial"></span></div>
          <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(this)">
          <label class="photo-label" for="photoInput">Clique para alterar foto</label>
        </div>
        <div class="grid-2">
          <div><label>Nome completo</label><input type="text" id="pNome"></div>
          <div><label>CPF</label><input type="text" id="pCpf"></div>
          <div><label>Telefone / WhatsApp</label><input type="text" id="pTel"></div>
          <div><label>Cidade / Estado</label><input type="text" id="pCidade" placeholder="Ex: Rio de Janeiro, RJ"></div>
        </div>
        <button class="btn btn-primary" onclick="salvarPerfil()" style="margin-top:16px;">Salvar Perfil</button>
      </div>

      <div class="card">
        <div class="card-header"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6"/><path d="M12 9v6"/><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg> Certificacoes</h3></div>
        <div class="grid-3">
          <div><label>ANAC</label><input type="text" id="pAnac"></div>
          <div><label>DECEA</label><input type="text" id="pDecea"></div>
          <div><label>ANATEL</label><input type="text" id="pHomologacao" placeholder="Número da homologação ANATEL"></div>
        </div>
        <button class="btn btn-primary" onclick="salvarPerfil()" style="margin-top:16px;">Salvar Certificacoes</button>
      </div>

      <div class="card">
        <div class="card-header"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Documentos</h3></div>
        <div class="add-bar">
          <input type="text" id="docName" placeholder="Nome do documento" style="flex:1;min-width:150px;">
          <select id="docType"><option>Piloto</option><option>Drone</option><option>Empresa</option><option>Seguro</option><option>SARPAS - Autorização de voo</option></select>
          <input type="date" id="docExpiry">
          <button class="btn btn-primary" onclick="addDoc()">Adicionar</button>
        </div>
        <div id="docList"><p style="color:var(--text3);font-size:0.85rem;">Nenhum documento cadastrado.</p></div>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('avatarInitial').textContent = (user.name||'U').charAt(0).toUpperCase();
    document.getElementById('userNameHeader').textContent = user.name||'Usuario';
    document.getElementById('planBadge').textContent = isPro?'PRO':'FREE';
    if(isPro){document.getElementById('planName').textContent='Pro';document.getElementById('planName').className='sidebar-foot-name pro';document.getElementById('planLink').textContent='Gerenciar';}

    function hydrateProfile(){
      saved=getProfile(uid);
      var fotoSalva=saved.foto;
      if(fotoSalva){document.getElementById('photoPreview').innerHTML='<img src="'+fotoSalva+'" alt="Foto do piloto">';}
      else{document.getElementById('photoPreview').innerHTML='<span id="photoInitial">'+(user.name||'U').charAt(0).toUpperCase()+'</span>';}
      document.getElementById('pNome').value=saved.nome||'';
      document.getElementById('pCpf').value=saved.cpf||'';
      document.getElementById('pTel').value=saved.telefone||'';
      document.getElementById('pCidade').value=saved.cidade||'';
      document.getElementById('pAnac').value=saved.anac||'';
      document.getElementById('pDecea').value=saved.decea||'';
      document.getElementById('pHomologacao').value=saved.homologacao||saved.crea||'';
      renderDocs();
    }

    function handlePhoto(input){
      var file=input.files[0];if(!file)return;
      var reader=new FileReader();
      reader.onload=function(e){
        var dataUrl=e.target.result;
        var profile=getProfile(uid);profile.foto=dataUrl;saveProfile(uid,profile);
        document.getElementById('photoPreview').innerHTML='<img src="'+dataUrl+'" alt="Foto">';
      };
      reader.readAsDataURL(file);
    }

    function salvarPerfil(){
      saveProfile(uid,{nome:document.getElementById('pNome').value,cpf:document.getElementById('pCpf').value,telefone:document.getElementById('pTel').value,cidade:document.getElementById('pCidade').value,anac:document.getElementById('pAnac').value,decea:document.getElementById('pDecea').value,homologacao:document.getElementById('pHomologacao').value});
      alert('Perfil salvo!');
    }

    function renderDocs(){
      var docs=getDocuments(uid);
      var list=document.getElementById('docList');
      if(docs.length===0){list.innerHTML='<p style="color:var(--text3);font-size:0.85rem;">Nenhum documento cadastrado.</p>';return;}
      list.innerHTML=docs.map(function(d){
        return '<div class="row"><div class="row-info"><strong>'+d.name+'</strong><span>'+(d.type||'')+(d.expiry?' Val: '+new Date(d.expiry).toLocaleDateString('pt-BR'):'')+'</span></div><div class="row-actions"><button class="action-btn edit" onclick="editDoc(\''+d.id+'\')">Editar</button><button class="action-btn delete" onclick="delDoc(\''+d.id+'\')">Excluir</button></div></div>';
      }).join('');
    }

    hydrateProfile();
    window.addEventListener('dronehub:cloud-ready', hydrateProfile);

    function addDoc(){
      var name=document.getElementById('docName').value.trim();var type=document.getElementById('docType').value;var expiry=document.getElementById('docExpiry').value;
      if(!name)return alert('Digite o nome');
      saveDocument(uid,{id:Date.now().toString(),name:name,type:type,expiry:expiry});
      document.getElementById('docName').value='';renderDocs();
    }

    function editDoc(id){
      var docs=getDocuments(uid);var d=docs.find(function(x){return x.id===id;});if(!d)return;
      var name=prompt('Nome:',d.name);if(!name)return;
      d.name=name;d.type=prompt('Tipo:',d.type)||d.type;d.expiry=prompt('Validade (AAAA-MM-DD):',d.expiry)||d.expiry;
      saveDocument(uid,d);
      renderDocs();
    }

    function delDoc(id){
      if(!confirm('Excluir documento?'))return;
      deleteDocument(uid,id);
      renderDocs();
    }
    renderDocs();
    if(typeof lucide!=='undefined'){lucide.createIcons();}
  </script>
</body>
</html>
